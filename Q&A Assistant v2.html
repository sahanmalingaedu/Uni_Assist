<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect } from "react";
        import ReactDOM from "react-dom/client";
        import { GoogleGenAI } from "@google/genai";
    
        const ai = new GoogleGenAI({ apiKey: "AIzaSyDpVJE7okxw0YDeJIyvEd8qhJF-uwK_3BY" });

        const askCollegeQuestion = async (question, college, mode = 'single', comparisonCollege = null, language = 'English') => {
            
            // Base system instruction
            let systemInstruction = `You are an expert assistant for university research. 
            Format your answers in clean Markdown, suitable for a professional resume-style document (bullet points are preferred).
            Respond strictly in ${language}.`;

            let query = "";

            // Construct the prompt based on mode
            if (mode === 'compare' && comparisonCollege) {
                systemInstruction += ` Your role is to compare ${college.name} and ${comparisonCollege.name}. 
                Answer questions based on information found on the official websites of both institutions: ${college.domain} and ${comparisonCollege.domain}.
                Provide a structured comparison.`;

                query = `${question} site:${college.domain} OR site:${comparisonCollege.domain}`;
            } else {
                systemInstruction += ` Your role is to answer questions strictly based on information found on the official ${college.name} website (${college.domain}) and its subdomains.`;
                query = `${question} site:${college.domain}`;
            }

            try {
                const response = await ai.models.generateContent({
                    model: "gemini-2.5-flash", 
                    contents: [{ role: 'user', parts: [{ text: query }] }],
                    config: {
                        systemInstruction: systemInstruction,
                        tools: [
                            { googleSearch: {} }, 
                            { googleMaps: {} }
                        ],
                    },
                });

                const answer = response.text || "No response generated.";
                
                const groundingChunks = response.candidates?.[0]?.groundingMetadata?.groundingChunks || [];               
                const sources = groundingChunks
                    .filter(chunk => chunk.web && chunk.web.uri)
                    .map(chunk => ({
                        uri: chunk.web.uri,
                        title: chunk.web.title || chunk.web.uri,
                    }));

                const mapLocations = groundingChunks
                    .filter(chunk => chunk.groundingChunk?.schema?.type === 'google_map_place' || (chunk.web?.uri?.includes('maps.google.com')))
                    .map(chunk => chunk.web?.uri)
                    .filter(uri => uri && uri.includes('maps'));

                const uniqueSources = Array.from(new Map(sources.map(item => [item.uri, item])).values());

                return {
                    answer,
                    sources: uniqueSources,
                    mapLocations: [] 
                };

            } catch (error) {
                console.error("Gemini API Error:", error);
                throw error;
            }
        };

        // Generates "suggested next questions" based on the previous answer
        const generateFollowUps = async (answer, collegeName) => {
             try {
                const prompt = `Based on the following answer about ${collegeName}, suggest 3 short, relevant follow-up questions a student might ask next. Return ONLY a JSON array of strings. 
                
                Answer Context: "${answer.substring(0, 1000)}..."`;

                const result = await ai.models.generateContent({
                    model: "gemini-2.5-flash", 
                    contents: [{ parts: [{ text: prompt }] }],
                    config: { responseMimeType: "application/json" }
                });

                if (result.text) {
                    return JSON.parse(result.text);
                }
                return [];
             } catch (e) {
                 return [];
             }
        };

        // Expands a specific bullet point into more detail
        const expandDeepDive = async (point, collegeName) => {
            try {
                const prompt = `Expand on the following point regarding ${collegeName} in 2-3 sentences. Be specific and informative.
                
                Point: "${point}"`;
                
                const result = await ai.models.generateContent({
                    model: "gemini-2.5-flash",
                    contents: [{ parts: [{ text: prompt }] }]
                });
                return result.text;
            } catch (e) {
                return "Could not load details.";
            }
        }

        // UI COMPONENTS
        const DeepDiveItem = ({ text, collegeName }) => {
            const [expanded, setExpanded] = useState(false);
            const [loading, setLoading] = useState(false);
            const [details, setDetails] = useState(null);

            const handleExpand = async () => {
                if (expanded) {
                    setExpanded(false);
                    return;
                }
                
                setExpanded(true);
                if (!details) {
                    setLoading(true);
                    const res = await expandDeepDive(text, collegeName);
                    setDetails(res);
                    setLoading(false);
                }
            };

            const parseInline = (txt) => {
                 const parts = txt.split(/(\*\*.*?\*\*|\[.*?\]\(.*?\))/g);
                return parts.map((part, i) => {
                    if (part.startsWith('**') && part.endsWith('**')) {
                        return <strong key={i} className="font-bold text-black">{part.slice(2, -2)}</strong>;
                    }
                    if (part.startsWith('[') && part.includes('](') && part.endsWith(')')) {
                         const match = part.match(/\[(.*?)\]\((.*?)\)/);
                         if (match) {
                             return <a key={i} href={match[2]} target="_blank" rel="noopener noreferrer" className="text-blue-700 underline hover:text-blue-900">{match[1]}</a>;
                         }
                    }
                    return part;
                });
            };

            return (
                <li className="relative pl-0 mb-2 text-sm leading-relaxed text-gray-800 flex flex-col items-start">
                    <div className="flex items-start w-full">
                        <span className="mr-2 text-black font-bold text-lg leading-[0.8rem] mt-1">•</span>
                        <div className="flex-1">
                            {parseInline(text)}
                            <button 
                                onClick={handleExpand}
                                className="ml-2 inline-flex items-center justify-center w-4 h-4 text-gray-400 hover:text-blue-600 transition-colors focus:outline-none align-middle"
                                title="Deep Dive: Click to expand"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" className="w-3 h-3">
                                    <path fillRule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clipRule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    {expanded && (
                        <div className="ml-5 mt-2 p-3 bg-blue-50 border-l-2 border-blue-500 text-xs text-gray-700 animate-fade-in rounded-r">
                            {loading ? (
                                <div className="flex items-center space-x-2">
                                    <div className="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
                                    <div className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{animationDelay: '0.1s'}}></div>
                                    <div className="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style={{animationDelay: '0.2s'}}></div>
                                </div>
                            ) : (
                                <p>{details}</p>
                            )}
                        </div>
                    )}
                </li>
            );
        };

        const SimpleMarkdown = ({ content, collegeName }) => {
            if (!content) return null;

            const lines = content.split('\n');
            const elements = [];
            let currentList = [];

            const parseInlineSimple = (text) => {
                const parts = text.split(/(\*\*.*?\*\*|\[.*?\]\(.*?\))/g);
                return parts.map((part, i) => {
                    if (part.startsWith('**') && part.endsWith('**')) {
                        return <strong key={i} className="font-bold text-black">{part.slice(2, -2)}</strong>;
                    }
                    if (part.startsWith('[') && part.includes('](') && part.endsWith(')')) {
                         const match = part.match(/\[(.*?)\]\((.*?)\)/);
                         if (match) {
                             return <a key={i} href={match[2]} target="_blank" rel="noopener noreferrer" className="text-blue-700 underline hover:text-blue-900">{match[1]}</a>;
                         }
                    }
                    return part;
                });
            };

            lines.forEach((line, i) => {
                const trimLine = line.trim();
                
                if (!trimLine) {
                    if (currentList.length > 0) {
                        elements.push(<ul key={`list-${i}`} className="list-disc ml-4 mb-2">{currentList}</ul>);
                        currentList = [];
                    }
                    return;
                }

                if (trimLine.startsWith('* ') || trimLine.startsWith('- ') || trimLine.startsWith('• ')) {
                    const text = trimLine.replace(/^[*•-]\s+/, '');
                    currentList.push(
                        <DeepDiveItem key={`li-${i}`} text={text} collegeName={collegeName} />
                    );
                } 

                else if (trimLine.startsWith('#')) {
                    const level = trimLine.match(/^#+/)[0].length;
                    const text = trimLine.replace(/^#+\s+/, '');
                    

                    const className = level === 1 ? "font-bold text-base mt-4 mb-2 uppercase" : 
                                      level === 2 ? "font-bold text-sm mt-3 mb-1 uppercase" : 
                                      "font-bold text-sm mt-2 mb-1";
                    
                    if (currentList.length > 0) {
                        elements.push(<ul key={`list-${i}`} className="list-disc ml-4 mb-2">{currentList}</ul>);
                        currentList = [];
                    }
                    elements.push(<div key={`h-${i}`} className={className}>{parseInlineSimple(text)}</div>);
                } 
                else {
                    if (currentList.length > 0) {
                        elements.push(<ul key={`list-${i}`} className="list-disc ml-4 mb-2">{currentList}</ul>);
                        currentList = [];
                    }
                    elements.push(<p key={`p-${i}`} className="mb-2 text-sm leading-relaxed">{parseInlineSimple(trimLine)}</p>);
                }
            });

            if (currentList.length > 0) {
                elements.push(<ul key={`list-end`} className="list-disc ml-4 mb-2">{currentList}</ul>);
            }

            return <div>{elements}</div>;
        };

        const SectionTitle = ({ title }) => (
            <h2 className="text-sm font-bold tracking-widest text-black uppercase border-b-2 border-gray-200 pb-1 mb-6 mt-10">
                {title}
            </h2>
        );

        const SkillPill = ({ label, onClick }) => (
            <button 
                onClick={onClick}
                disabled={!onClick}
                className={`inline-block bg-gray-100 border border-gray-200 text-gray-700 text-xs font-semibold px-4 py-2 rounded-full mr-3 mb-3 transition-colors ${onClick ? 'hover:bg-black hover:text-white hover:border-black cursor-pointer' : 'cursor-default'}`}
            >
                {label}
            </button>
        );

        const ContactTag = ({ icon, text, href }) => {
            const content = (
                <div className="flex items-center space-x-2 bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-md text-xs font-medium text-gray-700 hover:border-gray-400 transition-colors">
                    <span className="text-gray-500">{icon}</span>
                    <span>{text}</span>
                </div>
            );

            if (href) {
                return (
                    <a href={href} target="_blank" rel="noopener noreferrer" className="inline-block hover:opacity-80 transition-opacity">
                        {content}
                    </a>
                );
            }
            return <div className="inline-block">{content}</div>;
        };

        const INITIAL_COLLEGES = [
            {
                id: 'mit',
                name: 'Massachusetts Institute of Technology',
                shortName: 'MIT',
                domain: 'mit.edu',
                location: 'Cambridge, MA',
                suggestions: [
                    "What is the history of the Brass Rat?",
                    "How do I apply for undergraduate admission?",
                    "Tell me about the MIT Media Lab.",
                    "Who are some famous MIT alumni?",
                    "What is the Infinite Corridor?"
                ]
            },
            {
                id: 'harvard',
                name: 'Harvard University',
                shortName: 'Harvard',
                domain: 'harvard.edu',
                location: 'Cambridge, MA',
                suggestions: [
                    "What is the acceptance rate?",
                    "Tell me about the house system.",
                    "What are the popular majors?",
                    "History of Harvard Yard",
                    "How to apply to Harvard Law School?"
                ]
            },
            {
                id: 'stanford',
                name: 'Stanford University',
                shortName: 'Stanford',
                domain: 'stanford.edu',
                location: 'Stanford, CA',
                suggestions: [
                    "What is the 'Stanford Duck Syndrome'?",
                    "Tell me about the d.school.",
                    "Admission requirements for engineering",
                    "Who founded Stanford?",
                    "What is the Hoover Institution?"
                ]
            },
            {
                id: 'yale',
                name: 'Yale University',
                shortName: 'Yale',
                domain: 'yale.edu',
                location: 'New Haven, CT',
                suggestions: [
                    "Explain the residential college system.",
                    "What is the Yale Daily News?",
                    "Tell me about the drama school.",
                    "Who is Handsome Dan?",
                    "Tuition and financial aid"
                ]
            },
            {
                id: 'princeton',
                name: 'Princeton University',
                shortName: 'Princeton',
                domain: 'princeton.edu',
                location: 'Princeton, NJ',
                suggestions: [
                    "What are eating clubs?",
                    "Tell me about the senior thesis requirement.",
                    "What is the preceptorial system?",
                    "History of Nassau Hall",
                    "Undergraduate financial aid policies"
                ]
            }
        ];

        const LANGUAGES = ['English', 'Spanish', 'French', 'Chinese', 'Japanese', 'Arabic', 'German'];

        // Dropdown component for selecting institutions
        const CollegeDropdown = ({ colleges, selectedCollege, onSelect, label = "Institution" }) => {
            const [isOpen, setIsOpen] = useState(false);
            const dropdownRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        setIsOpen(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="relative w-full md:w-80 z-30" ref={dropdownRef}>
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className={`w-full flex items-center justify-between px-4 py-3 bg-white border rounded-md transition-all duration-200 group ${
                            isOpen 
                                ? 'border-black ring-1 ring-black shadow-lg' 
                                : 'border-gray-200 hover:border-gray-400 hover:shadow-sm'
                        }`}
                    >
                        <div className="flex flex-col items-start overflow-hidden mr-2">
                            <span className="text-[10px] uppercase tracking-widest text-gray-500 font-bold mb-0.5">{label}</span>
                            <span className="font-bold text-black text-sm truncate w-full text-left leading-tight">{selectedCollege ? selectedCollege.name : "Select College"}</span>
                        </div>
                        <div className={`p-1.5 rounded-full bg-gray-50 transition-colors group-hover:bg-gray-100 flex-shrink-0 ${isOpen ? 'bg-gray-100' : ''}`}>
                             <svg 
                                xmlns="http://www.w3.org/2000/svg" 
                                viewBox="0 0 24 24" 
                                fill="none" 
                                stroke="currentColor" 
                                strokeWidth="2.5" 
                                strokeLinecap="round" 
                                strokeLinejoin="round" 
                                className={`w-3.5 h-3.5 text-gray-500 transition-transform duration-300 ${isOpen ? 'rotate-180 text-black' : ''}`}
                            >
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </button>

                    {/* Dropdown Options */}
                    <div 
                        className={`absolute top-full left-0 right-0 mt-2 bg-white rounded-lg shadow-2xl border border-gray-100 overflow-hidden transform transition-all duration-200 origin-top ${
                            isOpen ? 'opacity-100 scale-100 translate-y-0' : 'opacity-0 scale-95 -translate-y-2 pointer-events-none'
                        }`}
                    >
                        <div className="max-h-[320px] overflow-y-auto sidebar-scroll py-2">
                            {colleges.map((college) => {
                                const isSelected = selectedCollege && selectedCollege.id === college.id;
                                return (
                                    <button
                                        key={college.id}
                                        onClick={() => {
                                            onSelect(college);
                                            setIsOpen(false);
                                        }}
                                        className={`w-full text-left px-5 py-3.5 transition-all duration-150 flex items-center justify-between group border-l-4 ${
                                            isSelected 
                                                ? 'bg-gray-50 border-black' 
                                                : 'border-transparent hover:bg-gray-50 hover:border-gray-200'
                                        }`}
                                    >
                                        <div className="flex flex-col overflow-hidden pr-3">
                                            <span className={`text-sm font-bold truncate leading-tight mb-1 ${isSelected ? 'text-black' : 'text-gray-600 group-hover:text-black'}`}>
                                                {college.name}
                                            </span>
                                            <span className={`text-[10px] font-medium uppercase tracking-wide ${isSelected ? 'text-black' : 'text-gray-400'}`}>
                                                {college.shortName}
                                            </span>
                                        </div>
                                        {isSelected && (
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="w-5 h-5 text-black flex-shrink-0 ml-2">
                                                <path fillRule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clipRule="evenodd" />
                                            </svg>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [colleges, setColleges] = useState(() => {
                const saved = localStorage.getItem('college_qa_colleges');
                return saved ? JSON.parse(saved) : INITIAL_COLLEGES;
            });
            const [history, setHistory] = useState(() => {
                const saved = localStorage.getItem('college_qa_history');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                localStorage.setItem('college_qa_colleges', JSON.stringify(colleges));
            }, [colleges]);

            useEffect(() => {
                localStorage.setItem('college_qa_history', JSON.stringify(history));
            }, [history]);

            const [selectedCollege, setSelectedCollege] = useState(colleges[0]);
            const [mode, setMode] = useState('single'); // 'single' | 'compare'
            const [comparisonCollege, setComparisonCollege] = useState(null);
            const [language, setLanguage] = useState('English');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);

            const [query, setQuery] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [response, setResponse] = useState(null);
            const [sources, setSources] = useState([]);
            const [followUps, setFollowUps] = useState([]);

            const [querySuggestions, setQuerySuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);
            
            const [newCollegeData, setNewCollegeData] = useState({
                name: '',
                shortName: '',
                domain: '',
                location: ''
            });
            const [isAutofilling, setIsAutofilling] = useState(false);

            const textareaRef = useRef(null);

            useEffect(() => {
                if (textareaRef.current) {
                    textareaRef.current.style.height = 'auto';
                    textareaRef.current.style.height = textareaRef.current.scrollHeight + 'px';
                }
            }, [query]);

            useEffect(() => {
                const timer = setTimeout(async () => {
                    if (!query || query.trim().length < 3) {
                        setShowSuggestions(false);
                        return;
                    }

                    if (querySuggestions.includes(query)) {
                         return;
                    }

                    try {
                        const prompt = `The user is typing a query about ${selectedCollege.name} ("${selectedCollege.shortName}").
                        Current text input: "${query}"
                        
                        Task:
                        1. Correct any spelling or grammar errors in the input.
                        2. Predict and autocomplete the question the user is likely asking.
                        3. Provide 3 distinct, complete, and grammatically correct question options relevant to ${selectedCollege.shortName}.
                        
                        Return strictly a JSON array of strings. Example: ["How do I apply for financial aid?", "What are the tuition fees?"]`;

                        const result = await ai.models.generateContent({
                            model: "gemini-2.5-flash", 
                            contents: [{ parts: [{ text: prompt }] }],
                            config: { responseMimeType: "application/json" }
                        });

                        if (result.text) {
                            const data = JSON.parse(result.text);
                            if (Array.isArray(data) && data.length > 0) {
                                const validSuggestions = data.filter(s => s.toLowerCase() !== query.toLowerCase());
                                if (validSuggestions.length > 0) {
                                    setQuerySuggestions(validSuggestions);
                                    setShowSuggestions(true);
                                } else {
                                    setShowSuggestions(false);
                                }
                            }
                        }
                    } catch (error) {
                    }
                }, 500);

                return () => clearTimeout(timer);
            }, [query, selectedCollege]);


            // Effect: Autofill New College Data
            useEffect(() => {
                const timer = setTimeout(async () => {
                    const nameInput = newCollegeData.name;
                    if (isModalOpen && nameInput.length > 2) {
                         setIsAutofilling(true);
                         try {
                             const prompt = `Identify the university from the partial input "${nameInput}". 
                             Return a JSON object with:
                             {
                                "officialName": "Full Official Name",
                                "shortName": "Common Abbreviation",
                                "domain": "website.edu (root domain only, no www/https)",
                                "location": "City, State"
                             }
                             If it is not a clear university match, return empty strings.`;

                             const result = await ai.models.generateContent({
                                model: "gemini-2.5-flash", 
                                contents: [{ parts: [{ text: prompt }] }],
                                config: { responseMimeType: "application/json" }
                            });

                            if (result.text) {
                                const data = JSON.parse(result.text);
                                if (data && data.domain) {
                                    setNewCollegeData(prev => ({
                                        ...prev,
                                        shortName: data.shortName || prev.shortName,
                                        domain: data.domain || prev.domain,
                                        location: data.location || prev.location
                                    }));
                                }
                            }
                         } catch (err) {
                             console.log("Autofill skipped", err);
                         } finally {
                             setIsAutofilling(false);
                         }
                    }
                }, 500);

                return () => clearTimeout(timer);
            }, [newCollegeData.name, isModalOpen]);

            const handleCollegeSelect = (college) => {
                setSelectedCollege(college);
                setResponse(null);
                setSources([]);
                setQuery('');
                setQuerySuggestions([]);
                setShowSuggestions(false);
                setFollowUps([]);
            };

            const handleSearch = async (e) => {
                if (e) e.preventDefault();
                if (!query.trim() || isLoading) return;
                
                setShowSuggestions(false);
                setIsLoading(true);
                setResponse(null);
                setSources([]);
                setFollowUps([]);

                try {
                    const result = await askCollegeQuestion(query, selectedCollege, mode, comparisonCollege, language);
                    setResponse(result.answer);
                    setSources(result.sources);

                    const generatedFollowUps = await generateFollowUps(result.answer, selectedCollege.name);
                    setFollowUps(generatedFollowUps);

                        college: selectedCollege,
                        query: query,
                        response: result.answer,
                        sources: result.sources,

                setResponse(item.response);
                setSources(item.sources);

                setShowSuggestions(false);

                const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
                
                const newCollege = {
                    id,
                    name,
                    shortName: shortName || name,
                    domain: domain.replace(/^https?:\/\//, '').replace(/\/$/, ''),

                        "Tuition and Financial Aid",
                        "Academic Programs",
                        "Campus Life",
                        "History and Traditions"

                                        <input 
                                            type="text" 
                                            placeholder="e.g. UC Berkeley"
                                            className="w-full bg-gray-50 border border-gray-300 p-3 text-sm rounded focus:outline-none focus:border-black focus:ring-1 focus:ring-black"
                                            value={newCollegeData.shortName}
                                            onChange={(e) => setNewCollegeData({...newCollegeData, shortName: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-gray-600 mb-2">Website Domain</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="e.g. berkeley.edu"
                                            className="w-full bg-gray-50 border border-gray-300 p-3 text-sm rounded focus:outline-none focus:border-black focus:ring-1 focus:ring-black"
                                            value={newCollegeData.domain}
                                            onChange={(e) => setNewCollegeData({...newCollegeData, domain: e.target.value})}
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-gray-600 mb-2">Location</label>
                                        <input 
                                            type="text" 
                                            placeholder="e.g. Berkeley, CA"
                                            className="w-full bg-gray-50 border border-gray-300 p-3 text-sm rounded focus:outline-none focus:border-black focus:ring-1 focus:ring-black"
                                            value={newCollegeData.location}
                                            onChange={(e) => setNewCollegeData({...newCollegeData, location: e.target.value})}
                                        />
                                    </div>
                                    
                                    <div className="flex justify-end gap-3 mt-6">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsModalOpen(false)}
                                            className="px-6 py-2.5 text-xs font-bold uppercase text-gray-600 hover:text-black hover:bg-gray-100 rounded transition-colors"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-6 py-2.5 bg-black text-white text-xs font-bold uppercase hover:bg-gray-800 rounded transition-colors shadow-lg"
                                        >
                                            Add Institution
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="fixed bottom-0 w-full bg-white/95 backdrop-blur-sm text-center py-3 text-[10px] text-gray-400 border-t border-gray-200 no-print z-20">
                        © 2026 {selectedCollege.name} Q&A. Created by Sahan Malinga.
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
